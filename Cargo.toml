[package]
name = "media-research-stack"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Apple Silicon stack for public-media research with av-ingest, SoundKit, and Cohere MLX ASR"
repository = "https://github.com/wavey-ai/media-research-stack"
readme = "README.md"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
av-ingest-proxy = { git = "https://github.com/wavey-ai/av-ingest.git", branch = "main", package = "av-ingest-proxy" }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
upload-response = { git = "https://github.com/wavey-ai/web-services.git", branch = "main", package = "av-upload-response" }
web-service = { git = "https://github.com/wavey-ai/web-services.git", branch = "main", package = "av-web-service" }

[target.'cfg(target_os = "macos")'.dependencies]
asr-api = { git = "https://github.com/wavey-ai/asr-api.git", branch = "main", default-features = false, features = ["cohere-mlx", "audio-decoder"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
asr-api = { git = "https://github.com/wavey-ai/asr-api.git", branch = "main", default-features = false, features = ["cohere-backend", "audio-decoder"] }

[dev-dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
